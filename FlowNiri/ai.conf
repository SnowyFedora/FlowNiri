# FlowNiri AI monitor settings.
# This file is user state: update.sh and rollback never overwrite it.
ENABLED=1
AGENTS=opencode,freebuff,claude,codex,kimi
# Budget per agent in tokens for a 5-hour window, used to turn local usage
# into a percentage when the provider reports none. 0 disables the percentage.
# Adjust to your plan in Settings -> AI agents.
LIMIT_OPENCODE=1000000
LIMIT_FREEBUFF=1000000
LIMIT_CLAUDE=190000
LIMIT_CODEX=250000
LIMIT_KIMI=500000
ANTHROPIC_API_KEY=
OPENAI_API_KEY=
MOONSHOT_API_KEY=
# Optional usage endpoints (queried with curl --max-time 5). Leave empty to
# use local data only (ccusage / codex sessions / agent databases).
ANTHROPIC_USAGE_URL=
OPENAI_USAGE_URL=
