# Gruvbox Dark Medium — Alacritty
[window]
padding = { x = 14, y = 12 }
dynamic_title = true
opacity = 0.97

[window.dimensions]
columns = 100
lines = 30

[font]
size = 11.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"
dim_foreground = "#a89984"
bright_foreground = "#fbf1c7"

[colors.cursor]
text = "#1d2021"
cursor = "#fabd2f"

[colors.vi_mode_cursor]
text = "#1d2021"
cursor = "#83a598"

[colors.selection]
text = "#fbf1c7"
background = "#504945"

[colors.search.matches]
foreground = "#1d2021"
background = "#fabd2f"

[colors.search.focused_match]
foreground = "#1d2021"
background = "#b8bb26"

[colors.footer_bar]
foreground = "#282828"
background = "#a89984"

[colors.hints.start]
foreground = "#1d2021"
background = "#fabd2f"

[colors.hints.end]
foreground = "#1d2021"
background = "#b8bb26"

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
